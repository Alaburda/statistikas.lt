project:
  type: website
  output-dir: docs
  resources:
    - .nojekyll
    - CNAME

lang: lt

website:
  title: "Statistikas.lt"
  description: "Statistikos ir duomenų analizės konsultacijos įmonėms ir tyrėjams: konsultacijos, projektai ir nuolatinė partnerystė."
  site-url: https://statistikas.lt
  favicon: images/favicon.svg
  search: false
  
  # Google Analytics
  google-analytics: "G-DT3Y3KGPJQ"
  
  # Open Graph / Twitter
  twitter-card:
    creator: "@p_alab"
    card-style: summary_large_image
    image: "images/card.png"
  
  open-graph:
    image: "images/card.png"
    
  navbar:
    background: light
    logo: images/mark.svg
    logo-alt: "Statistikas.lt"
    title: "Statistikas.lt"
    left:
      - text: "Paslaugos"
        href: paslaugos.qmd
      # Paslėpta, kol nėra pavyzdžių (taip pat žr. draft pavyzdziai.qmd)
      # - text: "Pavyzdžiai"
      #   href: pavyzdziai.qmd
      - text: "Straipsniai"
        href: straipsniai.qmd
      - text: "Apie"
        href: about.qmd
    right:
      - icon: linkedin
        href: https://www.linkedin.com/in/pauliusalaburda/
        aria-label: LinkedIn
      - text: "Susisiekti"
        href: kontaktai.qmd

  page-footer:
    left: |
      © 2026 Statistikas.lt · Paulius Alaburda
    center:
      - text: "Paslaugos"
        href: paslaugos.qmd
      # Paslėpta, kol nėra pavyzdžių (taip pat žr. draft pavyzdziai.qmd)
      # - text: "Pavyzdžiai"
      #   href: pavyzdziai.qmd
      - text: "Straipsniai"
        href: straipsniai.qmd
      - text: "Apie"
        href: about.qmd
    right:
      - text: "info@statistikas.lt"
        href: mailto:info@statistikas.lt

format:
  html:
    theme: 
      light: [flatly, theme/custom.scss]
    css: theme/styles.css
    include-after-body: 
      - text: |
          <script src="theme/main.js"></script>
    toc: false
    page-layout: full
    grid:
      sidebar-width: 0px
      body-width: 1200px
      margin-width: 0px

execute:
  freeze: auto
  warning: false
  message: false
