# Type-checks, tests and builds the free planning app (_planavimas-src/) on every
# change to it. Publishing is still `quarto render` + commit + push, which
# rebuilds the app into docs/planavimas/ via scripts/build-planavimas.ts.
name: Planavimas

on:
  push:
    paths: ["_planavimas-src/**", ".github/workflows/planavimas.yml"]
  pull_request:
    paths: ["_planavimas-src/**", ".github/workflows/planavimas.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: _planavimas-src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: _planavimas-src/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
