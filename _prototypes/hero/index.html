<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero variantai — statistikas.lt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #FFFFFF; --paper-2: #F5F4F1;
  --ink: #1C1B19; --ink-2: #4A4741; --ink-3: #6B675F; --line: #E3E1DC;
  --blue: #1F45A0; --red: #C23B2A; --yellow: #E9B93A;
  --g: 4px;
  --mono: 'IBM Plex Mono', ui-monospace, monospace;
  --sans: 'Instrument Sans', -apple-system, 'Segoe UI', sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }

/* ---------- Prototype switcher (not part of the design) ---------- */
.bar {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; flex-wrap: wrap; gap: 6px;
  padding: 7px 12px; background: #111; color: #bbb;
  font: 12px/1.3 var(--mono);
}
.bar b { color: #fff; font-weight: 500; margin-right: 6px; }
.bar button {
  font: inherit; color: #ccc; background: transparent; border: 1px solid #3a3a3a;
  padding: 5px 9px; cursor: pointer;
}
.bar button:hover { border-color: #888; color: #fff; }
.bar button[aria-pressed="true"] { background: var(--yellow); border-color: var(--yellow); color: var(--ink); }
.bar .sep { width: 1px; height: 20px; background: #3a3a3a; margin: 0 4px; }
.bar .note { flex-basis: 100%; color: #999; padding: 3px 0 1px; }
.bar .note strong { color: #fff; font-weight: 500; }

.stage-wrap { background: var(--paper); }
.stage { container: stage / inline-size; margin: 0 auto; background: var(--paper); }
body.phone .stage-wrap { background: #DCDAD5; padding: 24px 0 48px; min-height: calc(100vh - 60px); }
body.phone .stage { width: 390px; box-shadow: 0 12px 40px -18px rgba(0,0,0,.45); }

/* ---------- Site chrome mock ---------- */
.nav {
  height: 64px; display: flex; align-items: center; gap: 0.25rem;
  padding: 0 max(2rem, calc((100% - 1200px) / 2 + 2rem));
  border-bottom: 2px solid var(--ink); background: var(--paper);
}
.brand { display: flex; align-items: center; gap: .6rem; font-weight: 600; font-size: 1.25rem; letter-spacing: -.01em; color: var(--ink); text-decoration: none; margin-right: 1.25rem; }
.brand img { height: 28px; }
.links a { font-weight: 500; font-size: .98rem; color: var(--ink); text-decoration: none; padding: .5rem 1.1rem; }
.nav .cta { margin-left: auto; background: var(--blue); color: #fff; text-decoration: none; font-weight: 500; padding: .7rem 1.4rem; }
.burger { display: none; font-size: 1.6rem; line-height: 1; margin-right: .75rem; }

.after { padding: 2.25rem max(2rem, calc((100% - 1200px) / 2 + 2rem)); display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; border-bottom: 2px solid var(--ink); }
.after div { font-size: 2rem; letter-spacing: -.01em; }
.after span { display: block; font: .85rem var(--mono); color: var(--ink-2); margin-top: .3rem; }

/* ---------- Hero skeleton shared by all variants ---------- */
.hero { position: relative; overflow: hidden; border-bottom: var(--g) solid var(--ink); }
.hero-in {
  position: relative;
  display: grid;
  grid-template-columns: var(--wl, 0px) minmax(0, 1fr) var(--wr, 0px);
  height: clamp(540px, calc(100svh - 64px - var(--bar, 60px) - 4px), 780px);
}
.wing { min-width: 0; min-height: 0; grid-row: 1; position: relative; }
.wing.l { grid-column: 1; border-right: var(--wg, 4px) solid var(--ink); }
.wing.r { grid-column: 3; border-left: var(--wg, 4px) solid var(--ink); }
.deco { position: absolute; z-index: 0; }

.copy {
  grid-column: 2; grid-row: 1; position: relative; z-index: 2;
  display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  padding: 3rem clamp(1.5rem, 3cqw, 4rem);
}
.copy h1 {
  font-weight: 400; font-size: clamp(2.4rem, 4cqw, 4.2rem); line-height: 1.04; letter-spacing: -.022em;
  max-width: 15ch; text-wrap: balance; margin: 0 0 clamp(1rem, 3.5vh, 1.75rem);
}
.copy h1 em { font-style: normal; color: var(--blue); }
.lede { font-size: 1.2rem; line-height: 1.6; color: var(--ink-2); max-width: 33rem; margin: 0 0 clamp(1.25rem, 4vh, 2.25rem); text-wrap: pretty; }
.btn {
  display: inline-flex; align-items: center; padding: .95rem 1.5rem; font-weight: 600; font-size: 1rem;
  background: var(--blue); color: #fff; border: 2px solid var(--blue); text-decoration: none;
  transition: background .15s, color .15s, border-color .15s;
}
.btn:hover { background: var(--yellow); border-color: var(--ink); color: var(--ink); }
.hnote { margin: .6rem 0 0; font: .85rem var(--mono); color: var(--ink-2); }
.tl { margin-top: clamp(1rem, 3vh, 1.6rem); font-weight: 600; color: var(--ink); text-decoration: none; border-bottom: 2px solid var(--ink); padding-bottom: 2px; }
.tl:hover { color: var(--blue); border-color: var(--blue); }

/* Mondrian grid helper: black grout through the gap */
.m { display: grid; gap: var(--mg, 4px); background: var(--ink); width: 100%; height: 100%; }
.m > * { background: var(--paper); min-width: 0; min-height: 0; }
.m > .R, .R { background: var(--red); }
.m > .B, .B { background: var(--blue); }
.m > .Y, .Y { background: var(--yellow); }
.m > .K, .K { background: var(--ink); }

/* Phone colour band: replaces the wings below 900px */
.pband { display: none; height: 18px; gap: 4px; background: var(--ink); border-top: 4px solid var(--ink); grid-template-columns: var(--pb, 2.2fr 1fr .45fr 3fr); }
.pband > * { background: var(--paper); }
.pband > .R { background: var(--red); }
.pband > .B { background: var(--blue); }
.pband > .Y { background: var(--yellow); }
.pband > .K { background: var(--ink); }

@container stage (max-width: 899px) {
  .hero-in { grid-template-columns: 1fr; height: auto; background: none !important; }
  .wing, .deco { display: none !important; }
  .copy { grid-column: 1; padding: 3rem 1.25rem 2.75rem !important; align-items: flex-start; text-align: left; }
  .copy h1 { font-size: clamp(2.3rem, 10.5cqw, 3.4rem); }
  .lede { font-size: 1.1rem; }
  .pband { display: grid; }
  .links, .nav .cta { display: none; }
  .burger { display: block; }
  .nav { padding: 0 1rem; }
  .after { grid-template-columns: 1fr 1fr; padding: 2rem 1rem; }
}

/* ---------- Variant-specific pieces ---------- */

/* 4 Bimodal: the copy sits in the trough */
.bars4 { left: 0; right: 0; bottom: 0; height: 78%; display: flex; align-items: flex-end; gap: 4px; }
.bars4 i { flex: 1; height: calc(var(--h) * 1%); background: #E8E5DF; }
.bars4 i.B { background: var(--blue); }
.bars4 i.R { background: var(--red); }

/* 5 Graph paper */
.v5 .hero-in {
  background-image: linear-gradient(#ECE9E3 1px, transparent 1px), linear-gradient(90deg, #ECE9E3 1px, transparent 1px);
  background-size: 48px 48px;
}
.v5 .copy { background: transparent; }
.gcell { position: absolute; border: 3px solid var(--ink); }

/* 6 Skyline along the bottom */
.hz { left: 0; right: 0; bottom: 0; height: 100%; display: flex; align-items: flex-end; pointer-events: none; }
.hz .col { display: flex; flex-direction: column; gap: 4px; background: var(--ink); border-top: 4px solid var(--ink); border-left: 4px solid var(--ink); }
.hz .col:first-child { border-left: 0; }
.hz .col.row { flex-direction: row; flex: 1; }
.hz .col > * { background: var(--paper); }
.hz .col > .R { background: var(--red); }
.hz .col > .B { background: var(--blue); }
.hz .col > .Y { background: var(--yellow); }
.hz .col > .K { background: var(--ink); }
.v6 .copy { padding-bottom: 13%; }

/* 8 Violin halves */
.hbars { height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 5px; padding: 9% 0; }
.hbars i { flex: 1; width: calc(var(--w) * 1%); }
.hbars.l { align-items: flex-end; }
.hbars.l i { background: var(--blue); }
.hbars.r { align-items: flex-start; }
.hbars.r i { background: var(--red); }

/* 10 Known vs yours */
.hc { position: absolute; inset: 0; margin: 0; }
.hc figcaption { position: absolute; top: .9rem; left: 1rem; right: 1rem; font: .7rem var(--mono); letter-spacing: .04em; text-transform: uppercase; color: var(--ink-2); white-space: nowrap; overflow: hidden; }
.hc figcaption span { text-transform: none; color: var(--ink-3); margin-left: .4em; }
.hc.yours figcaption { font: 500 1.05rem var(--sans); letter-spacing: 0; text-transform: none; color: var(--ink); display: flex; justify-content: space-between; }
.hc.yours figcaption span { font: .7rem var(--mono); }
.hb { position: absolute; left: 0; right: 0; bottom: 0; height: 56%; display: flex; align-items: flex-end; gap: 3px; }
.hb i { flex: 1; height: calc(var(--h) * 1%); background: var(--blue); transition: height .9s cubic-bezier(.45, 0, .2, 1); }
.hc.yours .hb i { background: none; border: 1.5px dashed var(--ink-3); border-bottom: 0; }

@media (prefers-reduced-motion: reduce) { .hb i { transition: none; } }
</style>
</head>
<body>

<div class="bar" id="bar">
  <b>Hero variantai</b>
  <span id="tabs"></span>
  <span class="sep"></span>
  <button id="prev" title="Ankstesnis (←)">←</button>
  <button id="next" title="Kitas (→)">→</button>
  <span class="sep"></span>
  <button id="phone" aria-pressed="false" title="Telefono plotis (P)">Telefonas</button>
  <div class="note" id="note"></div>
</div>

<div class="stage-wrap">
  <div class="stage" id="stage">
    <nav class="nav">
      <span class="burger">☰</span>
      <a class="brand" href="#"><img src="../../images/mark.svg" alt="">Statistikas.lt</a>
      <div class="links"><a href="#">Paslaugos</a><a href="#">Pavyzdžiai</a><a href="#">Straipsniai</a><a href="#">Nemokama analizė</a><a href="#">Apie</a></div>
      <a class="cta" href="#">Susisiekti</a>
    </nav>
    <section class="hero" id="hero"></section>
    <div class="after">
      <div>nuo 2015<span>dirbu su statistika</span></div>
      <div>200+<span>projektų verslui ir tyrėjams</span></div>
      <div>4<span>recenzuotos publikacijos</span></div>
      <div>18<span>žmonių duomenų komanda</span></div>
    </div>
  </div>
</div>

<script>
const COPY = `
  <div class="copy">
    <h1>Statistikas jūsų komandai — <em>tada, kai jo reikia.</em></h1>
    <p class="lede">Padedu įmonėms ir tyrėjams priimti sprendimus, kuriais galima pasitikėti: nuo vienos konsultacijos iki reguliarių ataskaitų ir duomenų sistemų.</p>
    <a href="#" class="btn">Aptarkime jūsų projektą →</a>
    <p class="hnote">Pirmas 30 min. pokalbis — nemokamas</p>
    <a href="#" class="tl">Paslaugos ↓</a>
  </div>`;

// Helpers
const cell = (area, c = '') => `<div class="${c}" style="grid-area:${area}"></div>`;
const stack = (rows, colors) => `<div class="m" style="grid-template-rows:${rows}">${colors.map(c => `<div class="${c}"></div>`).join('')}</div>`;
const band = (cols, colors) => `<div class="pband" style="--pb:${cols}">${colors.map(c => `<div class="${c}"></div>`).join('')}</div>`;
const gauss = (x, mu, sd) => Math.exp(-0.5 * ((x - mu) / sd) ** 2);

const VARIANTS = [
  {
    name: 'Siauri sparnai',
    note: 'Dvi siauros (10 %) spalvų kolonos kraštuose, be histogramų. Centras beveik visas baltas.',
    wl: '10%', wr: '10%',
    l: stack('2.2fr 1fr .45fr 1.6fr', ['', 'R', '', '']),
    r: stack('1.1fr .6fr 2.4fr .8fr', ['', 'Y', '', 'B']),
    pb: ['2.2fr 1fr .45fr 3fr', ['', 'R', '', 'B']],
  },
  {
    name: 'Plonos linijos',
    note: 'Platesni sparnai, bet 2 px linijos ir tik po vieną mažą spalvos langelį kiekvienoje pusėje.',
    wl: '22%', wr: '22%', vars: '--mg:2px;--wg:2px',
    l: `<div class="m" style="grid-template-columns:1.4fr 1fr;grid-template-rows:.5fr 1.6fr 1fr .8fr">
          ${cell('1/1/2/3')}${cell('2/1/4/2')}${cell('2/2/3/3')}${cell('3/2/4/3', 'R')}${cell('4/1/5/2')}${cell('4/2/5/3')}</div>`,
    r: `<div class="m" style="grid-template-columns:1fr 1.4fr;grid-template-rows:.8fr 1fr 1.6fr .5fr">
          ${cell('1/1/2/2')}${cell('1/2/3/3')}${cell('2/1/3/2', 'Y')}${cell('3/1/5/2')}${cell('3/2/4/3')}${cell('4/2/5/3', 'B')}</div>`,
    pb: ['3fr .6fr 1.4fr .5fr', ['', 'R', '', 'B']],
  },
  {
    name: 'Kampai',
    note: 'Kompozicija tik dviejuose įstrižuose kampuose: raudona viršuje kairėje, mėlyna ir geltona apačioje dešinėje. Tekstas tikrai per vidurį.',
    deco: `
      <div class="deco m" style="left:0;top:0;width:24%;height:40%;grid-template-columns:1fr .55fr;grid-template-rows:1fr .45fr;border-right:4px solid var(--ink);border-bottom:4px solid var(--ink)">
        ${cell('1/1/2/2', 'R')}${cell('1/2/2/3')}${cell('2/1/3/2')}${cell('2/2/3/3')}</div>
      <div class="deco m" style="right:0;bottom:0;width:28%;height:36%;grid-template-columns:.5fr 1fr;grid-template-rows:.55fr 1fr;border-left:4px solid var(--ink);border-top:4px solid var(--ink)">
        ${cell('1/1/2/2')}${cell('1/2/2/3', 'Y')}${cell('2/1/3/2')}${cell('2/2/3/3', 'B')}</div>`,
    pb: ['1fr 3fr .5fr 1.4fr', ['R', '', 'Y', 'B']],
  },
  {
    name: 'Bimodalinis',
    note: 'Vienas didelis bimodalinis skirstinys per visą plotį, šviesiai pilkas. Smailės kraštuose, tekstas įduboje. Tik dvi stulpelio spalvos.',
    deco: () => {
      const n = 46, xs = [...Array(n)].map((_, i) => (i + .5) / n);
      const d = xs.map(x => gauss(x, .1, .07) + .82 * gauss(x, .9, .075));
      const max = Math.max(...d);
      const lPeak = d.indexOf(Math.max(...d.slice(0, n / 2)));
      const rPeak = d.lastIndexOf(Math.max(...d.slice(n / 2)));
      return `<div class="deco bars4">${d.map((v, i) => `<i class="${i === lPeak ? 'B' : i === rPeak ? 'R' : ''}" style="--h:${Math.max(1.2, v / max * 100).toFixed(1)}"></i>`).join('')}</div>`;
    },
    pb: ['3fr .5fr 1fr', ['', 'B', 'R']],
  },
  {
    name: 'Milimetrinis',
    note: 'Blankus 48 px tinklelis per visą hero, kaip grafiko fonas. Keli Mondriano langeliai pririšti prie tinklelio tik kraštuose.',
    cls: 'v5',
    deco: '<div class="deco" id="gcells" style="inset:0"></div>',
    after: layoutGrid,
    pb: ['1fr 2.5fr .6fr 1fr', ['B', '', 'Y', '']],
  },
  {
    name: 'Horizontas',
    note: 'Mondriano blokai tik apačioje: kraštuose aukštesni, link centro žemėja. Viršutinė dalis lieka visiškai švari.',
    deco: () => {
      const col = (w, h, cells, row = false) =>
        `<div class="col${row ? ' row' : ''}" style="${w ? `width:${w}%;` : ''}height:${h}%">${cells.map(([c, f]) => `<div class="${c}" style="flex:${f}"></div>`).join('')}</div>`;
      return `<div class="deco hz">
        ${col(9, 54, [['', 2], ['B', 3]])}
        ${col(7, 34, [['', 1], ['Y', 1.1]])}
        ${col(6, 20, [['', 1]])}
        ${col(0, 9, [['', 5], ['R', .5], ['', 2]], true)}
        ${col(6, 18, [['', 1]])}
        ${col(8, 40, [['', 1], ['K', .16]])}
        ${col(10, 58, [['Y', 1], ['', 1.4]])}
      </div>`;
    },
    cls: 'v6',
    pb: ['1fr .6fr 3fr .3fr 1.2fr', ['B', 'Y', '', 'R', 'Y']],
  },
  {
    name: 'Asimetrija',
    note: 'Kairėje platus mėlynas laukas, dešinėje tik siaura juosta. Tekstas centruotas likusiame plote, ne puslapyje.',
    wl: '30%', wr: '6%',
    l: `<div class="m" style="grid-template-columns:1fr .4fr;grid-template-rows:.45fr 2fr .8fr">
          ${cell('1/1/2/3')}${cell('2/1/3/2', 'B')}${cell('2/2/3/3')}${cell('3/1/4/2')}${cell('3/2/4/3', 'Y')}</div>`,
    r: stack('3fr .45fr 1fr', ['', 'R', '']),
    pb: ['3fr 1fr .4fr', ['B', 'Y', 'R']],
  },
  {
    name: 'Smuiko pusės',
    note: 'Du skirstiniai kaip horizontalūs stulpeliai, atsukti į tekstą: kairėje simetriškas, dešinėje asimetriškas. Palyginimas be žodžių.',
    wl: '22%', wr: '22%',
    l: () => {
      const n = 26;
      return `<div class="hbars l">${[...Array(n)].map((_, i) => `<i style="--w:${(6 + 88 * gauss((i + .5) / n, .5, .19)).toFixed(1)}"></i>`).join('')}</div>`;
    },
    r: () => {
      const n = 26;
      return `<div class="hbars r">${[...Array(n)].map((_, i) => { const t = (i + .5) / n; return `<i style="--w:${(6 + 88 * gauss(t, .34, t < .34 ? .11 : .26)).toFixed(1)}"></i>`; }).join('')}</div>`;
    },
    pb: ['1fr 2fr 1fr', ['B', '', 'R']],
  },
  {
    name: 'Plokštumos',
    note: 'Kuo mažiau langelių: po dvi ar tris dideles plokštumas kiekvienoje pusėje, storesnės (6 px) linijos.',
    wl: '18%', wr: '18%', vars: '--mg:6px;--wg:6px',
    l: stack('1.6fr 1fr', ['B', '']),
    r: stack('1.3fr .3fr 1fr', ['', 'R', 'Y']),
    pb: ['1.6fr 3fr .4fr 1fr', ['B', '', 'R', 'Y']],
  },
  {
    name: 'Žinomas ir jūsų',
    note: 'Lieka istorija iš dabartinio hero, bet tik du langeliai: kairėje normalusis skirstinys, dešinėje „Kokie jūsų duomenys?“, kuris persirikiuoja.',
    wl: '21%', wr: '21%',
    l: () => {
      const n = 17;
      return `<figure class="hc"><figcaption>Normalusis <span>N(μ, σ²)</span></figcaption><div class="hb">${[...Array(n)].map((_, i) => `<i style="--h:${(4 + 96 * gauss((i + .5) / n, .5, .17)).toFixed(1)}"></i>`).join('')}</div></figure>`;
    },
    r: () => `<figure class="hc yours"><figcaption>Kokie jūsų duomenys?<span>n = ?</span></figcaption><div class="hb" id="yours">${[22, 48, 81, 64, 37, 52, 90, 70, 41, 26, 15, 8].map(h => `<i style="--h:${h}"></i>`).join('')}</div></figure>`,
    after: startYours,
    pb: ['1.2fr 3fr .5fr', ['B', '', '']],
  },
];

// ---------- Variant 5: cells snapped to the 48px grid ----------
function layoutGrid() {
  const host = document.getElementById('gcells');
  if (!host) return;
  const W = host.clientWidth, H = host.clientHeight, s = 48;
  const cols = Math.floor(W / s), rows = Math.floor(H / s);
  const cells = [
    [1, 2, 3, 5, 'B'], [2, 9, 2, 2, 'R'], [0, rows - 3, 1, 2, 'K'],
    [cols - 5, 1, 3, 3, 'Y'], [cols - 2, 6, 1, 1, 'K'], [cols - 4, rows - 5, 2, 3, 'B'],
  ];
  host.innerHTML = cells.map(([c, r, w, h, k]) =>
    `<div class="gcell ${k}" style="left:${c * s}px;top:${r * s}px;width:${w * s + 1}px;height:${h * s + 1}px"></div>`).join('');
}

// ---------- Variant 10: the visitor's histogram keeps reshuffling ----------
let yoursTimer = null;
function startYours() {
  clearInterval(yoursTimer);
  const host = document.getElementById('yours');
  if (!host || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const bars = [...host.children], k = bars.length, rand = (a, b) => a + Math.random() * (b - a);
  const shapes = [
    () => { const mu = rand(.35, .65), sd = rand(.12, .2); return x => gauss(x, mu, sd); },
    () => { const r = rand(3, 6); return x => Math.exp(-r * x); },
    () => { const a = rand(.15, .35), b = rand(.6, .85); return x => gauss(x, a, .09) + rand(.5, 1) * gauss(x, b, .1); },
    () => () => 1,
  ];
  let last = -1;
  yoursTimer = setInterval(() => {
    let p; do { p = Math.floor(Math.random() * shapes.length); } while (p === last); last = p;
    const f = shapes[p](), raw = bars.map((_, i) => f((i + .5) / k) * rand(.85, 1.15)), max = Math.max(...raw);
    bars.forEach((b, i) => b.style.setProperty('--h', Math.max(5, Math.round(raw[i] / max * 92))));
  }, 2600);
}

// ---------- Switcher ----------
const hero = document.getElementById('hero');
const tabs = document.getElementById('tabs');
const note = document.getElementById('note');
const val = v => (typeof v === 'function' ? v() : v || '');
let current = 0;

tabs.innerHTML = VARIANTS.map((v, i) => `<button data-i="${i}" title="${v.name}">${i + 1}</button>`).join(' ');

function show(i) {
  current = (i + VARIANTS.length) % VARIANTS.length;
  const v = VARIANTS[current];
  clearInterval(yoursTimer);
  hero.className = 'hero ' + (v.cls || '');
  hero.innerHTML = `
    <div class="hero-in" style="--wl:${v.wl || '0px'};--wr:${v.wr || '0px'};${v.vars || ''}">
      ${v.wl ? `<div class="wing l">${val(v.l)}</div>` : ''}
      ${COPY}
      ${v.wr ? `<div class="wing r">${val(v.r)}</div>` : ''}
      ${val(v.deco)}
    </div>
    ${band(...v.pb)}`;
  if (v.after) v.after();
  tabs.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.i === current)));
  note.innerHTML = `<strong>${current + 1} · ${v.name}.</strong> ${v.note}`;
  history.replaceState(null, '', '#' + (current + 1));
  measureBar();
}

function measureBar() {
  document.documentElement.style.setProperty('--bar', document.getElementById('bar').offsetHeight + 'px');
}

tabs.addEventListener('click', e => { const b = e.target.closest('button'); if (b) show(+b.dataset.i); });
document.getElementById('prev').onclick = () => show(current - 1);
document.getElementById('next').onclick = () => show(current + 1);
const phoneBtn = document.getElementById('phone');
function togglePhone(on = !document.body.classList.contains('phone')) {
  document.body.classList.toggle('phone', on);
  phoneBtn.setAttribute('aria-pressed', String(on));
  if (VARIANTS[current].after) VARIANTS[current].after();
}
phoneBtn.onclick = () => togglePhone();

addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'ArrowRight') show(current + 1);
  else if (e.key === 'ArrowLeft') show(current - 1);
  else if (e.key === 'p' || e.key === 'P') togglePhone();
  else if (/^[0-9]$/.test(e.key)) show(e.key === '0' ? 9 : +e.key - 1);
});
addEventListener('resize', () => { measureBar(); if (current === 4) layoutGrid(); });

show(Math.max(0, Math.min(VARIANTS.length - 1, (parseInt(location.hash.slice(1), 10) || 1) - 1)));
</script>
</body>
