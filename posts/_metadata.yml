# Applies to every blog post: hooks the narrow reading column in theme/custom.scss
body-classes: post
# Įrašuose skyriai rašomi kaip "#"; pakeliame lygiu, kad puslapyje liktų vienas h1 (pavadinimas)
shift-heading-level-by: 1
# Baigiamasis kvietimas susisiekti įrašams, kuriuose jo dar nėra
filters:
  - _post-cta.lua
